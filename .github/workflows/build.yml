name: Build Skell Silence
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  dsp-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test C++ DSP (without JUCE)
        run: bash tests/run_cpp_tests.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure JUCE plugin
        run: cmake -S . -B build -A x64
      - name: Build Windows VST3
        run: cmake --build build --config Release --target SkellSilence_VST3 --parallel 2
      - name: Package build products
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3' | Select-Object -First 1
          if (-not $vst) { throw 'VST3 bundle missing' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Path $vst.FullName -Destination dist -Recurse -Force
      - uses: actions/upload-artifact@v6
        with:
          name: SkellSilence-Windows
          path: |
            dist/**
          if-no-files-found: error
