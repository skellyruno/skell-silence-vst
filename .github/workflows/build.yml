name: Build Skell Silence
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
# Cancel only outdated pull-request checks. Main, manual and release builds
# use their unique run IDs and are never canceled by a newer commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dsp-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test C++ DSP (without JUCE)
        run: bash tests/run_cpp_tests.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure JUCE plugin
        run: cmake -S . -B build -A x64
      - name: Build Windows VST3
        run: cmake --build build --config Release --target SkellSilence_VST3 --parallel 2
      - name: Package build products
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -Path 'build/SkellSilence_artefacts/Release/VST3' -Directory -Filter '*.vst3')
          if ($bundles.Count -ne 1) { throw "Expected one VST3 bundle, found $($bundles.Count)" }
          $vst = $bundles[0]
          $modules = @(Get-ChildItem -LiteralPath (Join-Path $vst.FullName 'Contents/x86_64-win') -File -Filter '*.vst3' -ErrorAction Stop)
          if ($modules.Count -ne 1) { throw "Expected one Windows x64 module, found $($modules.Count)" }
          $bytes = [IO.File]::ReadAllBytes($modules[0].FullName)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Module is not a Windows PE binary' }
          $metadataPath = Join-Path $vst.FullName 'Contents/Resources/moduleinfo.json'
          if (Test-Path -LiteralPath $metadataPath -PathType Leaf) {
            $raw = Get-Content -LiteralPath $metadataPath -Raw
            # JUCE-generated metadata may contain trailing commas; validate the shipped copy.
            $clean = $raw -replace ',(?=\\s*[}\\]])', ''
            $null = $clean | ConvertFrom-Json -ErrorAction Stop
            Set-Content -LiteralPath $metadataPath -Value $clean -Encoding utf8 -NoNewline
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath $vst.FullName -Destination dist -Recurse -Force
          $copy = Join-Path 'dist' $vst.Name
          $copyModules = @(Get-ChildItem -LiteralPath (Join-Path $copy 'Contents/x86_64-win') -File -Filter '*.vst3')
          if ($copyModules.Count -ne 1) { throw 'Packaged Windows module missing or duplicated' }
          Get-FileHash -LiteralPath $copyModules[0].FullName -Algorithm SHA256 | Format-List
          if (Test-Path -LiteralPath (Join-Path $copy 'Contents/Resources/moduleinfo.json')) {
            $null = Get-Content -LiteralPath (Join-Path $copy 'Contents/Resources/moduleinfo.json') -Raw | ConvertFrom-Json -ErrorAction Stop
          }
      - name: Validate VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: build/SkellSilence_artefacts/Release/VST3/Skell Silence.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3
      - uses: actions/upload-artifact@v6
        with:
          name: SkellSilence-Windows
          path: |
            dist/**
          if-no-files-found: error
          retention-days: 7
