name: Skell Silence v2.7 Guided Tour / real editor Quick4
on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'Source/PluginEditor.*'
      - 'Source/ui/HeaderBar.h'
      - 'tests/ui_renderer.cpp'
      - '.github/workflows/guided-tour-ui.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  real-juce-tour:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install headless real JUCE GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb xauth pkg-config libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev \
            libxinerama-dev libxcursor-dev libxrandr-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libgtk-3-dev
      - name: Configure current v2.7 editor and pinned SkellCore
        run: cmake -S . -B build-tour -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKELL_SILENCE_BUILD_UI_RENDERER=ON
      - name: Build actual PluginEditor and renderer
        run: cmake --build build-tour --target SkellSilenceUIRenderer --parallel 2
      - name: Verify three GuidedTour sizes and Quick4 baseline
        run: |
          set -euo pipefail
          runner=$(find build-tour -type f -name SkellSilenceUIRenderer -executable | head -n 1)
          test -n "$runner"
          xvfb-run -a -s '-screen 0 1920x1200x24' \
            "$runner" --output "$GITHUB_WORKSPACE/tour-screenshots"
          test -s tour-screenshots/minimum-guided-tour.png
          test -s tour-screenshots/standard-guided-tour.png
          test -s tour-screenshots/maximum-guided-tour.png
          test "$(find tour-screenshots -name '*.png' | wc -l)" -ge 7
      - name: Keep actual editor images for visual inspection
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SkellSilence-v2.7-GuidedTour-Quick4
          path: tour-screenshots/
          if-no-files-found: warn
          retention-days: 14
