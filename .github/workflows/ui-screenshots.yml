name: Skell Silence UI screenshots (real JUCE editor)

on:
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'tests/ui_renderer.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/ui-screenshots.yml'
  pull_request:
    paths:
      - 'Source/**'
      - 'tests/ui_renderer.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/ui-screenshots.yml'
  workflow_dispatch:

jobs:
  real-editor-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install JUCE GUI requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb xauth pkg-config libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev \
            libxinerama-dev libxcursor-dev libxrandr-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libgtk-3-dev
      - name: Configure pinned SkellCore renderer
        run: |
          cmake -S . -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSKELL_SILENCE_BUILD_UI_RENDERER=ON
      - name: Compile real PluginEditor screenshot executable
        run: cmake --build build-ui --target SkellSilenceUIRenderer --parallel 2
      - name: Render and validate scenes
        run: |
          renderer=$(find build-ui -type f -name SkellSilenceUIRenderer -executable | head -n 1)
          test -n "$renderer"
          xvfb-run -a -s '-screen 0 1920x1200x24' \
            "$renderer" --output "$GITHUB_WORKSPACE/ui-screenshots"
      - name: Upload actual JUCE screenshots and contact sheet
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SkellSilence-JUCE-UI-Screenshots
          path: ui-screenshots/
          retention-days: 14
          if-no-files-found: warn
