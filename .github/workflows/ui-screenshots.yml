name: Skell Silence UI screenshots (real JUCE editor)

# Capture the actual JUCE editor whenever UI, processor, renderer, or build
# configuration changes. Manual deep-audit runs remain available.
on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tests/**'
      - '.github/workflows/ui-screenshots.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tests/**'
      - '.github/workflows/ui-screenshots.yml'
  workflow_dispatch:

# Superseded PR screenshots may be canceled. Main and manual runs have unique
# groups and are never canceled by a newer run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  real-editor-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install JUCE GUI requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb xauth pkg-config libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev \
            libxinerama-dev libxcursor-dev libxrandr-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libgtk-3-dev
      - name: Configure pinned SkellCore renderer
        run: |
          cmake -S . -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSKELL_SILENCE_BUILD_UI_RENDERER=ON
      - name: Compile real PluginEditor screenshot executable
        run: cmake --build build-ui --target SkellSilenceUIRenderer --parallel 2
      - name: Render and validate scenes
        run: |
          renderer=$(find build-ui -type f -name SkellSilenceUIRenderer -executable | head -n 1)
          test -n "$renderer"
          xvfb-run -a -s '-screen 0 1920x1200x24' \
            "$renderer" --output "$GITHUB_WORKSPACE/ui-screenshots" --full
          test -s ui-screenshots/contact-sheet.png
          test "$(find ui-screenshots -type f -name '*.png' | wc -l)" -gt 0
      - name: Write screenshot provenance manifest
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_EVENT: ${{ github.event_name }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess
          root = pathlib.Path("ui-screenshots")
          images = []
          for path in sorted(root.rglob("*.png")):
              data = path.read_bytes()
              images.append({
                  "path": path.relative_to(root).as_posix(),
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })
          if not images or not any(x["path"] == "contact-sheet.png" for x in images):
              raise SystemExit("actual editor screenshots/contact sheet missing")
          manifest = {
              "schema_version": 1,
              "product": "Skell Silence",
              "version": "2.8.0",
              "renderer": "SkellSilenceUIRenderer --full",
              "commit": os.environ["BUILD_COMMIT"],
              "event": os.environ["BUILD_EVENT"],
              "run_id": os.environ["BUILD_RUN_ID"],
              "runner": platform.platform(),
              "scene_count": len(images),
              "images": images,
          }
          (root / "provenance.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"Recorded {len(images)} actual PNG screenshots with SHA-256 hashes")
          PY
      - name: Upload actual JUCE screenshots and provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SkellSilence-JUCE-UI-Screenshots
          path: ui-screenshots/
          retention-days: 14
          if-no-files-found: warn
